<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greeble World</title><style>body{margin:0;background:#392842;color:white;font:15px system-ui;overflow:hidden}canvas{display:block}#hud{position:absolute;top:16px;left:16px;background:#201329dd;padding:16px;border-radius:12px;max-width:340px}button{background:#eee0f5;color:#302039;border:0;border-radius:6px;padding:9px;margin:4px;cursor:pointer}#msg{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#201329cc;padding:10px;border-radius:8px;pointer-events:none}small{color:#e4cce9}#error{position:absolute;top:50%;left:20%;right:20%}</style></head><body><div id="hud"><b>GREEBLE WORLD</b><p id="score">Edible collected: 0 / 6 · Poison: 0</p><p id="time">Time: 0 s</p><small>WASD / arrows: move · drag: look<br>Click greenish Greebles; avoid bluish ones · R: reset</small><p><button id="reset">Reset</button><button id="save">Export CSV</button></p></div><div id="msg">Collect all six greenish Greebles. Bluish Greebles are poisonous!</div><div id="error"></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new T.Scene();scene.fog=new T.FogExp2(0x89738e,.012);const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const sky=new T.Mesh(new T.SphereGeometry(180,32,24),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,uniforms:{},vertexShader:'varying vec3 p; void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 p; void main(){float h=clamp(normalize(p).y*3.,0.,1.);gl_FragColor=vec4(mix(vec3(.98,.96,.93),vec3(.30,.015,.39),smoothstep(0.,1.,h)),1.);}'}));scene.add(sky);scene.add(new T.HemisphereLight(0xffe5ff,0x51405c,2));const sun=new T.DirectionalLight(0xffe5e0,2.3);sun.position.set(-18,35,12);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40});sun.shadow.mapSize.set(2048,2048);scene.add(sun);
let seed=934;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}const canvas=document.createElement('canvas');canvas.width=canvas.height=512;const ctx=canvas.getContext('2d');const im=ctx.createImageData(512,512);for(let i=0;i<im.data.length;i+=4){let n=rnd()*65;im.data[i]=80+n;im.data[i+1]=61+n;im.data[i+2]=87+n;im.data[i+3]=255}ctx.putImageData(im,0,0);const tex=new T.CanvasTexture(canvas);tex.wrapS=tex.wrapT=T.RepeatWrapping;tex.repeat.set(45,45);tex.colorSpace=T.SRGBColorSpace;const ground=new T.Mesh(new T.PlaneGeometry(300,300),new T.MeshStandardMaterial({map:tex,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const rockMat=new T.MeshStandardMaterial({color:0x827686,roughness:1});function rock(x,z,s){const geo=new T.IcosahedronGeometry(1,1);const a=geo.attributes.position;for(let i=0;i<a.count;i++){const x=a.getX(i),y=a.getY(i),z=a.getZ(i);const k=1+.16*Math.sin(x*17+y*9+z*13);a.setXYZ(i,x*k,y*k,z*k)}geo.computeVertexNormals();const m=new T.Mesh(geo,rockMat);m.scale.set(s*(.8+rnd()),s*(.45+rnd()*.6),s*(.7+rnd()));m.position.set(x,m.scale.y*.42,z);m.rotation.y=rnd()*6;m.castShadow=m.receiveShadow=true;scene.add(m)}for(let i=0;i<850;i++)rock((rnd()-.5)*150,-rnd()*130+15,.06+rnd()**5*.85);rock(5,-12,3);rock(2,-11,1.5);rock(-5,-9,1.1);rock(-3,-10,.9);
const objects=[];const positions=[[-3,-8],[3,-13],[1,-4],[-5,-20],[8,-22],[-10,-16],[12,-35],[-2,-32],[7,-8],[-13,-29],[0,-48],[16,-19]];const hueBoundary=170;const hues=[132,198,176,158,218,145,184,166,120,210,153,174];const edible=hues.map(h=>h<hueBoundary);function hueHex(h){const c=new T.Color().setHSL(h/360,.65,.48,T.SRGBColorSpace);return c.getHex(T.SRGBColorSpace)}const colors=hues.map(hueHex);function part(g,geo,mat,x,y,z,sx,sy,sz,rz=0){let m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.rotation.z=rz;m.castShadow=true;g.add(m);return m}const sphere=new T.SphereGeometry(1,24,16);const cone=new T.ConeGeometry(1,1,20);positions.forEach(([x,z],i)=>{const g=new T.Group(),mat=new T.MeshStandardMaterial({color:colors[i],roughness:.72});const w=.40+(i%3)*.08;part(g,sphere,mat,0,.62,0,w,.65,w*.8);part(g,sphere,mat,0,1.35,0,w*1.45,.36+(i%2)*.13,w);for(const side of [-1,1]){part(g,cone,mat,side*w*1.05,.82,.02,.16,.65,.19,-side*1.05);part(g,cone,mat,side*w*.95,1.28,.18,.13,.52,.15,-side*(1.8+i%3*.2));}if(i%2===0)part(g,sphere,mat,0,1.31,w*.85,.21,.16,.25);g.position.set(x,0,z);g.rotation.y=i*.73;g.scale.setScalar(.85+(i%4)*.15);g.userData={id:i+1,hue:hues[i],edible:edible[i],color:'#'+colors[i].toString(16).padStart(6,'0')};scene.add(g);objects.push(g)});
let yaw=0,pitch=-.10,start=performance.now(),logs=[],count=0,poison=0,finished=false;const keys=new Set();function reset(){camera.position.set(0,1.75,4);yaw=0;pitch=-.10;start=performance.now();logs=[];count=0;poison=0;finished=false;objects.forEach(g=>g.visible=true);document.querySelector('#score').textContent='Edible collected: 0 / 6 · Poison: 0';document.querySelector('#msg').textContent='Collect all six greenish Greebles. Bluish Greebles are poisonous!'}reset();const ray=new T.Raycaster();let down=null;const el=renderer.domElement;el.style.touchAction='none';el.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,drag:false};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!down)return;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>4)down.drag=true;if(down.drag){yaw-=(e.clientX-down.lastX)*.004;pitch=Math.max(-1.4,Math.min(1.4,pitch-(e.clientY-down.lastY)*.004))}down.lastX=e.clientX;down.lastY=e.clientY});el.addEventListener('pointercancel',()=>down=null);el.addEventListener('pointerup',e=>{if(down&&!down.drag&&!finished){ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);const hits=ray.intersectObjects(scene.children.filter(o=>o!==sky&&o.visible),true);if(hits.length){let g=hits[0].object;while(g&&!objects.includes(g))g=g.parent;if(g&&g.visible){logs.push([logs.length+1,g.userData.id,g.userData.color,g.userData.hue,hueBoundary,g.userData.edible?"edible":"poisonous",((performance.now()-start)/1000).toFixed(3),g.position.x,g.position.z,camera.position.x.toFixed(3),camera.position.z.toFixed(3),e.clientX,e.clientY]);g.visible=false;if(g.userData.edible)count++;else poison++;finished=count===6;document.querySelector('#score').textContent=`Edible collected: ${count} / 6 · Poison: ${poison}`;document.querySelector('#msg').textContent=finished?(poison===0?'You win! All edible Greebles collected without poisoning.':`All edible Greebles collected, but ${poison} poisonous Greeble(s) eaten. Reset to try for a perfect run.`):(g.userData.edible?'Edible Greeble collected!':'Poisonous Greeble! Penalty recorded.');}}}down=null});
// Exclude collected objects from raycasting (Three.js raycaster does not check visibility).
for(const g of objects)g.traverse(o=>{if(o.isMesh){const base=o.raycast;o.raycast=function(r,h){if(g.visible)base.call(this,r,h)}}});
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault();if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.querySelector('#reset').onclick=reset;document.querySelector('#save').onclick=()=>{const csv=['order,id,hex_colour,hue_deg,boundary_deg,category,elapsed_seconds,object_x,object_z,camera_x,camera_z,click_x_px,click_y_px',...logs.map(r=>r.join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='greeble_trial.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let prev=performance.now();function frame(t){let dt=Math.min(.05,(t-prev)/1000);prev=t;let f=Number(keys.has('w')||keys.has('arrowup'))-Number(keys.has('s')||keys.has('arrowdown')),r=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));let norm=Math.max(1,Math.hypot(f,r));camera.position.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*r)*dt*5/norm;camera.position.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*r)*dt*5/norm;camera.position.x=T.MathUtils.clamp(camera.position.x,-65,65);camera.position.z=T.MathUtils.clamp(camera.position.z,-100,20);camera.rotation.set(pitch,yaw,0,'YXZ');sky.position.copy(camera.position);if(!finished)document.querySelector('#time').textContent='Time: '+Math.floor((t-start)/1000)+' s';renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
